name: CF-02 Round 24 Finalize

on:
  push:
    branches:
      - review/cf02-40-round-2026-09-14

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/cf02-40-round-2026-09-14
          fetch-depth: 0
      - name: Apply frozen R24 runtime correction
        run: python3 .github/r24-redaction-runtime.py
      - name: Validate R24 correction
        run: |
          set -euo pipefail
          git diff --check
          find . -name '*.php' -not -path './vendor/*' -not -path './.git/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
          composer test
          python3 build/security_scan.py
      - name: Commit R24 correction
        run: |
          set -euo pipefail
          rm .github/r24-redaction-runtime.py
          git rm .github/workflows/cf02-r24-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'R24: complete runtime state-law alignment'
          git push origin HEAD:review/cf02-40-round-2026-09-14
