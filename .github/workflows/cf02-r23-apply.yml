name: CF-02 Round 23 Corrective Review

on:
  push:
    branches:
      - review/cf02-40-round-2026-09-14

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/cf02-40-round-2026-09-14
          fetch-depth: 0
      - name: Apply frozen correction
        run: |
          python3 .github/review23.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/c2n-fresh40.php')
          s=p.read_text()
          s=s.replace("    assert(strpos($repo, 'Open or unresolved appeal blocks purge until appeal closure.') < strpos($repo, 'Provider/cache/search deletion reconciliation is incomplete.'));\n", "")
          s=s.replace("    assert(str_contains($repo, \"lockCaseForLifecycle($caseId, ['closed'])\"));\n", "    assert(str_contains($repo, 'lockCaseForLifecycle($caseId, [\\'closed\\'])'));\n")
          s=s.replace("    $lock=strpos($repo, \"lockCaseForLifecycle($caseId, ['closed'])\", $purge);\n", "    $lock=strpos($repo, 'lockCaseForLifecycle($caseId, [\\'closed\\'])', $purge);\n")
          p.write_text(s)
          PY
      - name: Validate correction
        run: |
          set -euo pipefail
          git diff --check
          find . -name '*.php' -not -path './vendor/*' -not -path './.git/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
          php -d zend.assertions=1 tests/c2n-fresh40.php
          composer test
          python3 build/security_scan.py
      - name: Commit correction
        run: |
          set -euo pipefail
          rm .github/review23.py
          git rm .github/workflows/cf02-r23-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Review round 23: serialize purge with holds and appeals'
          git push origin HEAD:review/cf02-40-round-2026-09-14
