name: Apply CF-02 C2-M Corrective Patch

on:
  push:
    branches:
      - agent/cf-02-three-plan-final-completion
    paths:
      - .github/workflows/apply-c2m.yml

permissions:
  contents: write

concurrency:
  group: cf02-c2m-patch
  cancel-in-progress: false

jobs:
  apply-review-fixes:
    if: github.actor == 'majidhussainqadri1-dot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cf-02-three-plan-final-completion
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium
          coverage: none
      - name: Reconstruct and verify reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/c2m-patch-00.b64 .github/c2m-patch-01.b64 .github/c2m-patch-02.b64 .github/c2m-patch-03.b64 .github/c2m-patch-04.b64 .github/c2m-patch-05.b64 > /tmp/c2m.patch.gz.b64
          echo '69de6b1181e5c3e1780a2d42f46ca7416529f4c3c9611861d59b70982ac5f773  /tmp/c2m.patch.gz.b64' | sha256sum -c -
          base64 --decode /tmp/c2m.patch.gz.b64 | gzip --decompress > /tmp/c2m.patch
          echo '6953532a9c0b6cba351ad3bb07cdcde714ed273b9e016890fba3c639dc94f984  /tmp/c2m.patch' | sha256sum -c -
          git apply --check /tmp/c2m.patch
          git apply /tmp/c2m.patch
          rm .github/c2m-patch-00.b64 .github/c2m-patch-01.b64 .github/c2m-patch-02.b64 .github/c2m-patch-03.b64 .github/c2m-patch-04.b64 .github/c2m-patch-05.b64
          git diff --check
      - name: Run forty-round and complete regression evidence
        shell: bash
        run: |
          set -euo pipefail
          find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          python3 - <<'PY'
          import json, subprocess, sys
          commands = json.load(open('composer.json'))['scripts']['test']
          for command in commands:
              print(command, flush=True)
              result = subprocess.run(command, shell=True)
              if result.returncode:
                  sys.exit(result.returncode)
          PY
          python3 build/security_scan.py
      - name: Commit exact reviewed correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add -A
          git commit -m 'Complete fresh CF-02 forty-round review and corrections'
          git push origin HEAD:agent/cf-02-three-plan-final-completion
