name: CF-02 R26-R29 Correction Materialization
on:
  push:
    branches: [review/cf02-40-round-2026-09-14]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/cf02-40-round-2026-09-14
          fetch-depth: 0
      - name: Apply frozen R26-R29 corrections
        run: python3 .github/review26_29.py
      - name: Validate corrected tree
        run: |
          set -euo pipefail
          git diff --check
          find . -name '*.php' -not -path './vendor/*' -not -path './.git/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
          composer test
          python3 build/security_scan.py
      - name: Commit corrected tree
        run: |
          set -euo pipefail
          rm .github/review26_29.py
          git rm .github/workflows/cf02-r26-r29-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'R26-R29: materialize validated corrective reviews'
          git push origin HEAD:review/cf02-40-round-2026-09-14
