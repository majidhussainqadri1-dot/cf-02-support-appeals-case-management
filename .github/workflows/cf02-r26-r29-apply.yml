name: CF-02 R26-R29 Correction Materialization
on:
  push:
    branches: [review/cf02-40-round-2026-09-14]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/cf02-40-round-2026-09-14
          fetch-depth: 0
      - name: Apply frozen R26-R29 corrections
        run: python3 .github/review26_29.py
      - name: Repair generated R28 regression literal escaping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/c2n-r24-r33.php')
          s = p.read_text()
          start = s.index("$test(28,")
          end = s.index("$test(29,", start)
          block = r'''$test(28,'retention purge removes derivatives and stores only bounded provider evidence',static function()use($read):void{
              $repo=$read('src/Infrastructure/WordPress/OperationsRepository.php');
              assert(str_contains($repo, "DELETE nr FROM {\$this->tables['note_revisions']} nr JOIN {\$this->tables['messages']}"));
              assert(str_contains($repo, "DELETE t FROM {\$this->tables['tokens']} t JOIN {\$this->tables['attachments']}"));
              assert(str_contains($repo, "\$this->wpdb->delete(\$this->tables['inbound'], ['case_uuid' => \$caseId])"));
              assert(str_contains($repo, "'result_hash' => \$rawHash"));
              assert(str_contains($repo, "'provider_results_json' => \$this->json(\$summary)"));
              assert(!str_contains($repo, "'provider_results_json' => \$this->json(\$providerResults)"));
          });
          '''
          p.write_text(s[:start] + block + s[end:])
          PY
      - name: Validate corrected tree
        run: |
          set -euo pipefail
          git diff --check
          find . -name '*.php' -not -path './vendor/*' -not -path './.git/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
          composer test
          python3 build/security_scan.py
      - name: Commit corrected tree
        run: |
          set -euo pipefail
          rm .github/review26_29.py
          git rm .github/workflows/cf02-r26-r29-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'R26-R29: materialize validated corrective reviews'
          git push origin HEAD:review/cf02-40-round-2026-09-14
