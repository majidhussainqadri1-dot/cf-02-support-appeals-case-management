name: CF-02 Sequential Review Apply

on:
  push:
    branches:
      - review/cf02-r30-r39-2026-09-16
    paths:
      - .github/review_apply.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/cf02-r30-r39-2026-09-16
          fetch-depth: 0
      - name: Apply frozen review corrections
        run: python3 .github/review_apply.py
      - name: Commit corrected tree locally
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs build
          if git diff --cached --quiet; then
            echo "No correction diff to commit."
          else
            git commit -m "Sequential review: apply frozen corrections"
          fi
      - name: Validate corrected committed tree
        run: |
          set -euo pipefail
          git diff --check
          find . -name '*.php' -not -path './vendor/*' -not -path './.git/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
          composer test
          python3 -m py_compile build/package.py build/verify_package.py
          python3 build/security_scan.py
      - name: Push validated corrected tree
        run: |
          set -euo pipefail
          git push origin HEAD:review/cf02-r30-r39-2026-09-16
