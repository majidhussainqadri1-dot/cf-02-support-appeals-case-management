name: CF-02 CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: sodium
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: PHP syntax
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: C2-A activation and governance tests
        run: php -d zend.assertions=1 tests/run.php

      - name: C2-B intake, case, attachment and resolution tests
        run: php -d zend.assertions=1 tests/c2b.php

      - name: C2-B first-review regression tests
        run: php -d zend.assertions=1 tests/c2b-review1.php

      - name: C2-B second-review adversarial tests
        run: php -d zend.assertions=1 tests/c2b-review2.php

      - name: C2-C assignment SLA escalation and incident tests
        run: php -d zend.assertions=1 tests/c2c.php

      - name: C2-C first-review regression tests
        run: php -d zend.assertions=1 tests/c2c-review1.php

      - name: C2-C second-review adversarial tests
        run: php -d zend.assertions=1 tests/c2c-review2.php

      - name: C2-D authorization command search evidence tests
        run: php -d zend.assertions=1 tests/c2d.php

      - name: C2-D first-review regressions
        run: php -d zend.assertions=1 tests/c2d-review1.php

      - name: C2-D second-review adversarial tests
        run: php -d zend.assertions=1 tests/c2d-review2.php

      - name: C2-E appeal fairness tests
        run: php -d zend.assertions=1 tests/c2e.php

      - name: C2-E first-review regressions
        run: php -d zend.assertions=1 tests/c2e-review1.php

      - name: C2-E second-review adversarial tests
        run: php -d zend.assertions=1 tests/c2e-review2.php

      - name: C2-F quality knowledge automation resilience tests
        run: php -d zend.assertions=1 tests/c2f.php

      - name: C2-F first-review regressions
        run: php -d zend.assertions=1 tests/c2f-review1.php

      - name: C2-F second-review adversarial tests
        run: php -d zend.assertions=1 tests/c2f-review2.php

      - name: C2-G migration and cutover tests
        run: php -d zend.assertions=1 tests/c2g.php

      - name: C2-G first-review regressions
        run: php -d zend.assertions=1 tests/c2g-review1.php

      - name: C2-G second-review adversarial tests
        run: php -d zend.assertions=1 tests/c2g-review2.php

      - name: C2-H schema resilience recovery release tests
        run: php -d zend.assertions=1 tests/c2h.php

      - name: C2-H first-review regressions
        run: php -d zend.assertions=1 tests/c2h-review1.php

      - name: C2-H second-review adversarial tests
        run: php -d zend.assertions=1 tests/c2h-review2.php

      - name: C2-I complete runtime integration tests
        run: php -d zend.assertions=1 tests/c2i.php

      - name: C2-I first-review regressions
        run: php -d zend.assertions=1 tests/c2i-review1.php

      - name: C2-I second-review adversarial tests
        run: php -d zend.assertions=1 tests/c2i-review2.php

      - name: Release engineering regressions
        run: php -d zend.assertions=1 tests/release.php

      - name: Public repository safety scan
        run: python3 build/security_scan.py
