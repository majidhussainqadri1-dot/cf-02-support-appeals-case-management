name: Apply CF-02 Forty Review Patch

on:
  push:
    branches: ['agent/cf-02-plan-completion-audit-fixes']
  workflow_dispatch:

permissions:
  contents: write

# This second commit ensures the workflow already exists before the triggering push.
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cf-02-plan-completion-audit-fixes
          fetch-depth: 2
      - name: Reconstruct and verify patch
        run: |
          cat .github/cf02-review-patch/* > /tmp/cf02.patch.gz.b64
          base64 -d /tmp/cf02.patch.gz.b64 > /tmp/cf02.patch.gz
          test "$(sha256sum /tmp/cf02.patch.gz | cut -d' ' -f1)" = "cf488deb6dfe146eb719d7c635f346500b828829d30634835d8e76f826417a51"
          gzip -dc /tmp/cf02.patch.gz > /tmp/cf02.patch
          git apply --check /tmp/cf02.patch
      - name: Apply, validate and commit
        run: |
          git apply /tmp/cf02.patch
          rm -rf .github/cf02-review-patch
          rm -f .github/workflows/apply-forty-review-patch.yml
          find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
          php -d zend.assertions=1 tests/c2j-forty-review.php
          python3 build/security_scan.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete forty-round CF-02 corrective review and regressions"
          git push origin HEAD:agent/cf-02-plan-completion-audit-fixes
