name: Apply CF-02 post-exact-head review 3

on:
  push:
    branches:
      - agent/cf-02-three-plan-harmonization-rc5
    paths:
      - .github/workflows/apply-cf02-review3.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cf-02-three-plan-harmonization-rc5
          fetch-depth: 0

      - name: Apply deterministic forensic corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          p=Path('src/Infrastructure/WordPress/ComprehensiveRestController.php')
          s=p.read_text()
          s=s.replace(
              'use Sabri\\CF02\\Authorization\\WordPressPrincipalContextFactory;\nuse Sabri\\CF02\\Contracts\\SupportContractCatalog;',
              'use Sabri\\CF02\\Authorization\\WordPressPrincipalContextFactory;\nuse Sabri\\CF02\\Configuration\\CategoryRoutingPolicy;\nuse Sabri\\CF02\\Contracts\\SupportContractCatalog;\nuse Sabri\\CF02\\Governance\\ServiceEqualityPolicy;'
          )
          s=s.replace(
              "            $category = sanitize_key((string) $request->get_param('category'));\n            SupportContractCatalog::assertCategory($category);",
              "            $rawInput = $request->get_json_params();\n            if (!is_array($rawInput)) {\n                $rawInput = $request->get_body_params();\n            }\n            $rawInput = is_array($rawInput) ? $rawInput : [];\n            ServiceEqualityPolicy::assertNoPrivilegeSignals($rawInput);\n            CategoryRoutingPolicy::assertNoClientOverrides($rawInput);\n\n            $category = sanitize_key((string) $request->get_param('category'));\n            SupportContractCatalog::assertCategory($category);\n            $category = CategoryRoutingPolicy::normalize($category);"
          )
          s=s.replace(
              "            // Requesters describe impact/urgency; they never grant themselves P1/P2 authority.\n            $priority = $impact === 'account_blocked' && $urgency === 'time_sensitive' ? 'P2' : 'P3';",
              "            // Requesters describe impact/urgency; they never grant themselves P1/P2 authority or routing authority.\n            $priority = ServiceEqualityPolicy::requesterPriority($impact, $urgency);"
          )
          old="""    private function queueForCategory(string $category): string
              {
                  return match ($category) {
                      'privacy_data_rights' => 'privacy_liaison',
                      'safety_abuse' => 'safety_liaison',
                      'verification', 'account_access' => 'identity_coordination',
                      'learning_billing', 'marketplace' => 'financial_coordination',
                      'clinic_appointment' => 'clinic_coordination',
                      'messages_calls' => 'communication_support',
                      'publishing' => 'publishing_support',
                      'media_pdf' => 'media_support',
                      'accessibility' => 'accessibility_support',
                      default => 'technical_support',
                  };
              }
          """
          new="""    private function queueForCategory(string $category): string
              {
                  return CategoryRoutingPolicy::queueFor($category);
              }
          """
          if old not in s:
              raise SystemExit('obsolete controller queue map not found')
          p.write_text(s.replace(old,new))

          p=Path('src/Configuration/CategoryRoutingPolicy.php')
          s=p.read_text()
          s=s.replace(
              'final class CategoryRoutingPolicy\n{',
              "final class CategoryRoutingPolicy\n{\n    /** @var list<string> */\n    private const CLIENT_CONTROLLED_ROUTING_FIELDS = [\n        'queue', 'queue_key', 'priority', 'severity', 'owner_ref', 'assigned_to',\n        'sla_policy', 'sla_deadline', 'specialist_required', 'reviewer_reference',\n    ];"
          )
          s=s.replace(
              '    public static function queueFor(string $category): string\n    {',
              "    /** @param array<string,mixed> $input */\n    public static function assertNoClientOverrides(array $input): void\n    {\n        foreach (self::CLIENT_CONTROLLED_ROUTING_FIELDS as $field) {\n            if (array_key_exists($field, $input)) {\n                throw new InvalidArgumentException(sprintf(\n                    'Support routing and priority are server-owned; client field is forbidden: %s.',\n                    $field\n                ));\n            }\n        }\n    }\n\n    public static function queueFor(string $category): string\n    {"
          )
          p.write_text(s)

          p=Path('src/Governance/ServiceEqualityPolicy.php')
          s=p.read_text()
          s=s.replace(
              "        'founder_favoritism',\n    ];",
              "        'founder_favoritism',\n        'paid_support',\n        'premium_support',\n        'support_tier',\n        'subscription_tier',\n        'subscriber_tier',\n        'patron_status',\n        'financial_contribution',\n        'vip_status',\n    ];"
          )
          old="""    public static function assertNoPrivilegeSignals(array $context): void
              {
                  foreach (self::PROHIBITED_PRIVILEGE_FIELDS as $field) {
                      if (array_key_exists($field, $context)) {
                          throw new InvalidArgumentException(sprintf(
                              'Support priority and appeal processing cannot consume privilege signal: %s.',
                              $field
                          ));
                      }
                  }
              }
          """
          new="""    public static function assertNoPrivilegeSignals(array $context): void
              {
                  $prohibited = [];
                  foreach (self::PROHIBITED_PRIVILEGE_FIELDS as $field) {
                      $prohibited[self::normalizeKey($field)] = $field;
                  }

                  self::walkKeys($context, $prohibited);
              }

              /** @param array<mixed> $context @param array<string,string> $prohibited */
              private static function walkKeys(array $context, array $prohibited): void
              {
                  foreach ($context as $key => $value) {
                      if (is_string($key)) {
                          $normalized = self::normalizeKey($key);
                          if (isset($prohibited[$normalized])) {
                              throw new InvalidArgumentException(sprintf(
                                  'Support priority and appeal processing cannot consume privilege signal: %s.',
                                  $key
                              ));
                          }
                      }
                      if (is_array($value)) {
                          self::walkKeys($value, $prohibited);
                      }
                  }
              }

              private static function normalizeKey(string $key): string
              {
                  return strtolower((string) preg_replace('/[^a-z0-9]+/i', '', $key));
              }
          """
          if old not in s:
              raise SystemExit('old equality validator not found')
          p.write_text(s.replace(old,new))

          p=Path('src/Integration/PrivacySafeOutcomeProjection.php')
          s=p.read_text()
          s=s.replace(
              "    private const FINAL_OUTCOMES = ['uphold', 'modify', 'overturn', 'remand', 'withdraw'];",
              "    private const FINAL_OUTCOMES = ['uphold', 'modify', 'overturn', 'remand', 'withdraw'];\n\n    /** @var list<string> */\n    private const NON_FINAL_STATES = [\n        'submitted', 'eligibility_review', 'accepted', 'rejected', 'under_review',\n        'native_decision_pending', 'reopened',\n    ];\n\n    /** @var list<string> */\n    private const FINAL_STATES = ['decided', 'implemented', 'closed'];"
          )
          s=s.replace(
              "            if (in_array($state, ['submitted', 'eligibility_review', 'accepted', 'under_review', 'native_decision_pending', 'reopened'], true)) {\n                ++$excludedPending;\n                continue;\n            }",
              "            if (in_array($state, self::NON_FINAL_STATES, true)) {\n                ++$excludedPending;\n                continue;\n            }\n            if (!in_array($state, self::FINAL_STATES, true)) {\n                throw new InvalidArgumentException('Outcome projection contains an unknown appeal state.');\n            }"
          )
          p.write_text(s)

          p=Path('src/Infrastructure/WordPress/ProviderWebhookController.php')
          s=p.read_text()
          s=s.replace(
              'use Sabri\\CF02\\Authorization\\PrincipalContext;\nuse Sabri\\CF02\\Domain\\SupportCaseId;',
              'use Sabri\\CF02\\Authorization\\PrincipalContext;\nuse Sabri\\CF02\\Configuration\\CategoryRoutingPolicy;\nuse Sabri\\CF02\\Contracts\\SupportContractCatalog;\nuse Sabri\\CF02\\Domain\\SupportCaseId;\nuse Sabri\\CF02\\Governance\\ServiceEqualityPolicy;'
          )
          start=s.index("                $category = sanitize_key((string) ($payload['category'] ?? 'technical'));\n")
          end=s.index("                    $this->now()\n                );", start)+len("                    $this->now()\n                );")
          block="""                ServiceEqualityPolicy::assertNoPrivilegeSignals($payload);
                          CategoryRoutingPolicy::assertNoClientOverrides($payload);
                          $category = sanitize_key((string) ($payload['category'] ?? 'technical'));
                          SupportContractCatalog::assertCategory($category);
                          $category = CategoryRoutingPolicy::normalize($category);
                          $caseResult = $this->intake->createOrReplay(
                              $requesterRef,
                              'provider_' . substr(hash('sha256', $sourceOwner . "\\0" . $externalId), 0, 48),
                              [
                                  'category' => $category,
                                  'priority' => 'P3',
                                  'severity' => 'normal',
                                  'locale' => sanitize_text_field((string) ($payload['locale'] ?? 'ur-PK')),
                                  'subject' => sanitize_text_field((string) ($payload['subject'] ?? 'Inbound support request')),
                              ],
                              $this->now()
                          );"""
          p.write_text(s[:start]+block+s[end:])

          Path('docs/RELEASE-PROCESS.md').write_text(
              Path('docs/RELEASE-PROCESS.md').read_text().replace('1.0.0-rc.2','1.0.0-rc.5').replace('Schema: `1.1.0`','Schema: `1.3.0`')
          )
          Path('docs/STAGING-ACCEPTANCE.md').write_text(
              Path('docs/STAGING-ACCEPTANCE.md').read_text().replace('Exact `1.0.0-rc.2` package checksum is recorded.','Exact `1.0.0-rc.5` package checksum and source SHA are recorded.')
          )
          Path('docs/CHANGE-CONTROL.md').write_text(
              Path('docs/CHANGE-CONTROL.md').read_text().replace('idempotent schema 1.2 installation','idempotent schema 1.3 installation')
          )
          Path('CHANGELOG.md').write_text(
              Path('CHANGELOG.md').read_text().replace('## 1.0.0-rc.4 — Forty-round corrective review candidate\n','### Additional forty-round RC4 corrective evidence\n')
          )

          test_source=r'''<?php

declare(strict_types=1);
ini_set('assert.exception','1');assert_options(ASSERT_ACTIVE,1);assert_options(ASSERT_EXCEPTION,1);
require_once dirname(__DIR__).'/src/Autoload.php';\Sabri\CF02\Autoload::register(dirname(__DIR__).'/src');

use Sabri\CF02\Configuration\CategoryRoutingPolicy;
use Sabri\CF02\Governance\ServiceEqualityPolicy;
use Sabri\CF02\Integration\PrivacySafeOutcomeProjection;

$failures=[];$test=static function(string $name,callable $case)use(&$failures):void{try{$case();fwrite(STDOUT,"PASS {$name}\n");}catch(Throwable $error){$failures[]=$name.': '.$error->getMessage();fwrite(STDERR,"FAIL {$name}: {$error->getMessage()}\n");}};
$root=dirname(__DIR__);

$test('requester controller normalizes legacy categories before routing events',static function()use($root):void{
    $source=(string)file_get_contents($root.'/src/Infrastructure/WordPress/ComprehensiveRestController.php');
    assert(str_contains($source,'$category = CategoryRoutingPolicy::normalize($category);'));
    assert(str_contains($source,'return CategoryRoutingPolicy::queueFor($category);'));
    assert(!str_contains($source,"'learning_billing', 'marketplace' => 'financial_coordination'"));
    assert(str_contains($source,'ServiceEqualityPolicy::requesterPriority($impact, $urgency)'));
});

$test('signed inbound adapters cannot self-assign priority severity or queue',static function()use($root):void{
    $source=(string)file_get_contents($root.'/src/Infrastructure/WordPress/ProviderWebhookController.php');
    assert(str_contains($source,'CategoryRoutingPolicy::assertNoClientOverrides($payload);'));
    assert(str_contains($source,'SupportContractCatalog::assertCategory($category);'));
    assert(str_contains($source,'$category = CategoryRoutingPolicy::normalize($category);'));
    assert(!str_contains($source,'$payload[\'priority\'] ?? \'P3\''));
    assert(!str_contains($source,'$payload[\'queue\'] ?? \'technical_support\''));
});

$test('routing override keys are rejected at every client boundary',static function():void{
    foreach(['queue','queue_key','priority','severity','owner_ref','assigned_to','sla_policy'] as $field){
        $blocked=false;
        try{CategoryRoutingPolicy::assertNoClientOverrides([$field=>'attacker-choice']);}catch(InvalidArgumentException){$blocked=true;}
        assert($blocked);
    }
});

$test('nested and alternate-style financial privilege keys are rejected',static function():void{
    foreach([
        ['context'=>['donationAmount'=>0]],
        ['metadata'=>['VIP-Status'=>false]],
        ['support'=>['premium_support'=>'none']],
        ['subscriberTier'=>'free'],
    ] as $payload){
        $blocked=false;
        try{ServiceEqualityPolicy::assertNoPrivilegeSignals($payload);}catch(InvalidArgumentException){$blocked=true;}
        assert($blocked);
    }
});

$test('File 26 projection rejects invented appeal states',static function():void{
    $blocked=false;
    try{(new PrivacySafeOutcomeProjection())->project([
        ['appeal_state'=>'garbage_final','outcome'=>'uphold','implementation_confirmed'=>true],
    ],'policy-v3',10);}catch(InvalidArgumentException){$blocked=true;}
    assert($blocked);
});

$test('current release and staging documents contain the RC5 identity',static function()use($root):void{
    $release=(string)file_get_contents($root.'/docs/RELEASE-PROCESS.md');
    $staging=(string)file_get_contents($root.'/docs/STAGING-ACCEPTANCE.md');
    $change=(string)file_get_contents($root.'/docs/CHANGE-CONTROL.md');
    $changelog=(string)file_get_contents($root.'/CHANGELOG.md');
    assert(str_contains($release,'Candidate version: `1.0.0-rc.5`'));
    assert(str_contains($release,'Schema: `1.3.0`'));
    assert(!str_contains($release,'1.0.0-rc.2'));
    assert(str_contains($staging,'Exact `1.0.0-rc.5` package checksum and source SHA'));
    assert(str_contains($change,'idempotent schema 1.3 installation'));
    assert(substr_count($changelog,'## 1.0.0-rc.4')===1);
});

if($failures!==[])exit(1);fwrite(STDOUT,"CF-02 post-exact-head forensic review round 3 passed.\n");
'''
          Path('tests/c2k-review3.php').write_text(test_source)

          p=Path('composer.json')
          data=json.loads(p.read_text())
          command='php -d zend.assertions=1 tests/c2k-review3.php'
          if command not in data['scripts']['test']:
              index=data['scripts']['test'].index('php -d zend.assertions=1 tests/c2k-review2.php')
              data['scripts']['test'].insert(index+1,command)
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')

          p=Path('docs/REVIEW-REGISTER-C2K.md')
          s=p.read_text()
          insert="""
          ## Review 3 — post-exact-head forensic consistency review

          The first exact-head candidate passed automated QA, after which a fresh manual source-to-contract inspection found and corrected additional drift:

          1. The requester controller retained an obsolete local queue map, so persisted cases were corrected by the repository but creation events could still advertise a stale queue. The controller now delegates exclusively to `CategoryRoutingPolicy`.
          2. Legacy category input could be accepted but remain unnormalized in controller-level events. Normalization now occurs before routing, persistence, SLA and event creation.
          3. A signed inbound adapter could propose its own priority, severity and queue. Client/provider routing overrides are now rejected and safe server-owned defaults are applied before human triage.
          4. Donation/paid-support keys could be nested or expressed in alternate casing. Equality enforcement now recursively normalizes and rejects prohibited key variants.
          5. File 26 could aggregate an invented appeal state when the outcome looked final. Only the explicit appeal-state allowlist is accepted.
          6. Release/staging documentation still contained obsolete RC2/schema identities and the changelog repeated an RC4 version heading. All current handoff documents now identify RC5/schema 1.3 consistently.

          Result: corrected and retested by `tests/c2k-review3.php`; every source change invalidates the earlier package and requires a new exact-head build and full workflow rerun.

          """
          marker='## Known unresolved defects within coded scope\n'
          if '## Review 3 — post-exact-head forensic consistency review' not in s:
              s=s.replace(marker,insert+marker)
          p.write_text(s)
          PY

          rm -f .github/cf02-rc5-review3.patch.b64
          git restore --source=HEAD --staged --worktree .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix post-exact-head routing and evidence drift"
          git push origin HEAD:agent/cf-02-three-plan-harmonization-rc5
