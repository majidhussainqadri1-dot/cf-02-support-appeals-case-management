name: CF-02 R35 Apply and Validate

on:
  push:
    branches:
      - review/cf02-r30-r39-2026-09-16
    paths:
      - '.github/workflows/cf02-r35-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/cf02-r30-r39-2026-09-16
          fetch-depth: 0
      - name: Apply frozen R35 corrections
        run: python3 .github/r35_apply.py
      - name: Validate R35 corrected tree
        run: |
          set -euo pipefail
          git diff --check
          find . -name '*.php' -not -path './vendor/*' -not -path './.git/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
          composer test
          python3 build/security_scan.py
      - name: Commit R35 corrected tree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/r35_apply.py .github/workflows/cf02-r35-apply.yml
          git add src/Application/RuntimeWorkflowPolicy.php src/Infrastructure/WordPress/OperationsRepository.php src/Infrastructure/WordPress/ComprehensiveRestController.php tests/c2n-r24-r33.php
          git diff --cached --check
          git commit -m 'R35: enforce server-evidence governance gates'
          git push origin HEAD:review/cf02-r30-r39-2026-09-16
