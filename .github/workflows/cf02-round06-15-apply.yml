name: CF-02 Round 06-15 Corrective Commit

on:
  push:
    branches: ['review/cf02-40-round-2026-09-14']

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/cf02-40-round-2026-09-14
          fetch-depth: 0
      - name: Verify frozen Round 05 ancestor and bounded staging delta
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 41214718e559c05539c0d6b0a44df03442a3e1fc HEAD
          changed="$(git diff --name-only 41214718e559c05539c0d6b0a44df03442a3e1fc..HEAD)"
          test "$changed" = '.github/workflows/cf02-round06-15-apply.yml'
      - name: Apply frozen Round 06-15 corrective batch
        env:
          PATCH_B64_A: 
          PATCH_B64_B: 
        run: |
          set -euo pipefail
          printf '%s%s' "$PATCH_B64_A" "$PATCH_B64_B" | base64 -d | gzip -d > /tmp/cf02-round06-15.patch
          patch -p1 --forward < /tmp/cf02-round06-15.patch
          git rm .github/workflows/cf02-round06-15-apply.yml
          git diff --check
      - name: Regression and repository safety
        run: |
          set -euo pipefail
          composer validate --strict
          find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          composer test
          python3 build/security_scan.py
          git diff --check
      - name: Commit and push reviewed corrections
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fresh reviews 06-15: corrective audit cycle'
          git push origin HEAD:review/cf02-40-round-2026-09-14
