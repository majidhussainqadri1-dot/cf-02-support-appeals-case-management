name: CF-02 Round 06-15 Corrective Commit

on:
  push:
    branches: ['review/cf02-40-round-2026-09-14']

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/cf02-40-round-2026-09-14
          fetch-depth: 0
      - name: Verify exact frozen patch and base ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 41214718e559c05539c0d6b0a44df03442a3e1fc HEAD
          for f in part00 part01 part02 part03 part04a part04b part04c part04d part05a part05b part05c part05d part06a part06b part06c part06d part07; do test -f ".github/review0615/$f"; done
          cat \
            .github/review0615/part00 \
            .github/review0615/part01 \
            .github/review0615/part02 \
            .github/review0615/part03 \
            .github/review0615/part04a \
            .github/review0615/part04b \
            .github/review0615/part04c \
            .github/review0615/part04d \
            .github/review0615/part05a \
            .github/review0615/part05b \
            .github/review0615/part05c \
            .github/review0615/part05d \
            .github/review0615/part06a \
            .github/review0615/part06b \
            .github/review0615/part06c \
            .github/review0615/part06d \
            .github/review0615/part07 \
            | base64 -d > /tmp/cf02-round06-15.patch
          echo '3ec4ee7cee9f65fd63a877bfa09bd8df467ac5f7554820fe8054b4ad874fde36  /tmp/cf02-round06-15.patch' | sha256sum -c -
          patch --dry-run -p1 --forward < /tmp/cf02-round06-15.patch
      - name: Apply frozen Round 06-15 corrective patch
        run: |
          set -euo pipefail
          patch -p1 --forward < /tmp/cf02-round06-15.patch
          rm -rf .github/review0615
          git rm .github/workflows/cf02-round06-15-apply.yml
          git diff --check
      - name: Regression and repository safety
        run: |
          set -euo pipefail
          find . -name '*.php' -not -path './vendor/*' -not -path './.git/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
          php -d zend.assertions=1 tests/c2n-fresh40.php
          composer test
          python3 build/security_scan.py
          git diff --check
      - name: Commit and push reviewed corrections
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Review rounds 06-15: correct frozen defect ledgers'
          git push origin HEAD:review/cf02-40-round-2026-09-14
