name: CF-02 Round 05 Bounded Patch
on:
  push:
    branches: ['review/cf02-40-round-2026-09-14']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/cf02-40-round-2026-09-14
          fetch-depth: 0
      - name: Verify round 04 exact-head ancestor
        run: git merge-base --is-ancestor e7432313cdd7e2e0fa7ca661325a16832320dd94 HEAD
      - name: Apply frozen Round 05 corrections and regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/Infrastructure/WordPress/OperationsRepository.php')
          s=p.read_text()
          old="if (in_array((string) $case['state'], ['closed'], true)) {\n            throw new RuntimeException('Closed cases cannot receive messages before governed reopen.');\n        }"
          new="if (in_array((string) $case['state'], ['closed', 'withdrawn'], true)) {\n            throw new RuntimeException('Closed or withdrawn cases cannot receive messages before governed reopen.');\n        }"
          if s.count(old) != 1: raise SystemExit(f'Round05 message target count={s.count(old)}')
          s=s.replace(old,new,1)
          pos=s.index('public function createAttachment(')
          tail=s[pos:]
          old2="$this->caseForActor($caseId, $context);\n        if ($size < 1 || $size > 25 * 1024 * 1024"
          new2="$case = $this->caseForActor($caseId, $context);\n        if (in_array((string) $case['state'], ['closed', 'withdrawn'], true)) {\n            throw new RuntimeException('Closed or withdrawn cases cannot receive attachments before governed reopen.');\n        }\n        if ($size < 1 || $size > 25 * 1024 * 1024"
          if tail.count(old2) != 1: raise SystemExit(f'Round05 attachment target count={tail.count(old2)}')
          p.write_text(s[:pos]+tail.replace(old2,new2,1))
          p=Path('tests/c2n-fresh40.php')
          s=p.read_text(); marker='\nif($failures!==[])'
          test="\n$test(5,'closed and withdrawn cases reject new messages and attachments until governed reopen',static function()use($read):void{\n    $source=$read('src/Infrastructure/WordPress/OperationsRepository.php');\n    assert(str_contains($source, 'Closed or withdrawn cases cannot receive messages before governed reopen.'));\n    assert(str_contains($source, 'Closed or withdrawn cases cannot receive attachments before governed reopen.'));\n});\n"
          if marker not in s or 'closed and withdrawn cases reject' in s: raise SystemExit('Round05 test precondition failed')
          p.write_text(s.replace(marker,test+marker,1).replace('passed through round 04.','passed through round 05.'))
          p=Path('docs/FORTY-ROUND-REVIEW-2026-09-14.md')
          s=p.read_text()
          if '## Round 05 —' in s: raise SystemExit('Round05 ledger already present')
          add="\n\n## Round 05 — Case lifecycle, terminal-state content mutation and optimistic-concurrency audit\n\n### Frozen defect ledger\n\n1. **Withdrawn-case reply contradiction** — reply-options marked `withdrawn` non-replyable, but `appendMessage()` blocked only `closed`, allowing a capable caller to append after withdrawal without governed reopen.\n2. **Terminal-case attachment contradiction** — reply-options marked `closed` and `withdrawn` non-attachable, but `createAttachment()` had no case-state guard, allowing attachment work on terminal cases without governed reopen.\n\nThe remainder of this audit found optimistic case mutations version-bound and governed transition checks present on lifecycle mutations.\n\n### Correction after ledger freeze\n\n- `appendMessage()` rejects both `closed` and `withdrawn` until governed reopen.\n- `createAttachment()` applies the same terminal-state boundary.\n- Permanent regression coverage added to `tests/c2n-fresh40.php`.\n\n### Evidence state\n\n- Local regression required before commit.\n- Exact-head automated QA required before Round 06.\n- Staging/Live: not evaluated by this repository review.\n"
          p.write_text(s+add)
          PY
      - name: Local regression
        run: |
          php -l src/Infrastructure/WordPress/OperationsRepository.php
          php -l tests/c2n-fresh40.php
          php -d zend.assertions=1 tests/c2n-fresh40.php
          python3 build/security_scan.py
          git diff --check
      - name: Commit correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/Infrastructure/WordPress/OperationsRepository.php tests/c2n-fresh40.php docs/FORTY-ROUND-REVIEW-2026-09-14.md
          git commit -m 'Review round 05: enforce terminal-case content mutation boundary'
          git push origin HEAD:review/cf02-40-round-2026-09-14
