name: CF-02 R31 Apply and Validate
on:
  push:
    branches: [review/cf02-r30-r39-2026-09-16]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/cf02-r30-r39-2026-09-16
          fetch-depth: 0
      - name: Apply frozen R31 corrections
        run: python3 .github/r31_apply.py
      - name: Validate R31 corrected tree
        run: |
          set -euo pipefail
          git diff --check
          find . -name '*.php' -not -path './vendor/*' -not -path './.git/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
          composer test
          python3 build/security_scan.py
      - name: Commit R31 corrected tree
        run: |
          set -euo pipefail
          rm .github/r31_apply.py
          git rm .github/workflows/cf02-r31-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'R31: enforce terminal-state monotonicity and runtime resolution'
          git push origin HEAD:review/cf02-r30-r39-2026-09-16
