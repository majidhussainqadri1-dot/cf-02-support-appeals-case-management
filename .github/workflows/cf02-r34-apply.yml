name: CF-02 R34 Apply and Validate

on:
  push:
    branches:
      - review/cf02-r30-r39-2026-09-16
    paths:
      - '.github/workflows/cf02-r34-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/cf02-r30-r39-2026-09-16
          fetch-depth: 0
      - name: Apply frozen R34 corrections
        run: |
          python3 .github/r34_apply.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/c2n-r24-r33.php')
          s=p.read_text()
          s=s.replace(
              'assert(str_contains($repo,"eventReplay($attachmentId, $eventType, $idempotencyKey, $payload, \'attachment\')"));',
              'assert(str_contains($repo,"eventReplay(\\$attachmentId, \\$eventType, \\$idempotencyKey, \\$payload, \'attachment\')"));'
          )
          p.write_text(s)
          PY
      - name: Validate R34 corrected tree
        run: |
          set -euo pipefail
          git diff --check
          find . -name '*.php' -not -path './vendor/*' -not -path './.git/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
          composer test
          python3 build/security_scan.py
      - name: Commit R34 corrected tree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/r34_apply.py .github/workflows/cf02-r34-apply.yml
          git add src/Infrastructure/WordPress/OperationsRepository.php src/Infrastructure/WordPress/ProviderWebhookController.php tests/c2n-r24-r33.php
          git diff --cached --check
          git commit -m 'R34: harden signed provider replay semantics'
          git push origin HEAD:review/cf02-r30-r39-2026-09-16
